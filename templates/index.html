<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision & IoT Command Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-12">
        <header class="text-center mb-16">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider mb-4">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Edge Vision Engine Active
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
                Vision &amp; IoT Command Hub
            </h1>
            <p class="text-slate-400 max-w-2xl mx-auto text-sm md:text-base">
                Real-time OpenCV, MediaPipe gesture tracking, and automated IoT edge controls.
            </p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for pid, p in projects.items() %}
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between hover:border-slate-700 hover:shadow-xl hover:shadow-blue-500/5 transition-all">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-2xl">
                            {{ p['icon'] }}
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                            READY
                        </span>
                    </div>
                    <h2 class="text-xl font-bold text-white mb-2">
                        {{ p['title'] }}
                    </h2>
                    <p class="text-slate-400 text-sm mb-6 leading-relaxed">
                        {{ p['desc'] }}
                    </p>
                </div>
                <a href="/project/{{ pid }}" class="w-full inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-colors shadow-lg shadow-blue-600/20">
                    Launch System &rarr;
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
