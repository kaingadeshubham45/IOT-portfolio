<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision &amp; IoT Edge Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fallback dark theme styles if CDN blocks */
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        .hub-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .hub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 24px;
            margin-bottom: 36px;
        }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            border-color: #06b6d4;
        }
        .btn-launch {
            background: #1e293b;
            color: #ffffff;
            text-align: center;
            padding: 10px 16px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-top: 20px;
            display: block;
            border: 1px solid #334155;
        }
        .btn-launch:hover {
            background: #0891b2;
            border-color: #06b6d4;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <div class="hub-header flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 mb-8 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
                    <span>🤖</span> AI Vision &amp; IoT Command Hub
                </h1>
                <p class="text-slate-400 text-sm mt-1">12 Real-Time Edge Computer Vision &amp; Hardware Automation Modules</p>
            </div>
            <div class="px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider">
                ● Live Edge Engine Active
            </div>
        </div>

        <div class="grid-cards grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for key, proj in projects.items() %}
            <div class="card bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-3xl p-2.5 bg-slate-950 rounded-xl border border-slate-800">{{ proj.icon }}</span>
                        <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-cyan-950/80 text-cyan-400 border border-cyan-800">
                            {{ proj.id[:3].upper() }}
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2">
                        {{ proj.title }}
                    </h3>
                    <p class="text-xs text-slate-400 leading-relaxed">
                        {{ proj.desc }}
                    </p>
                </div>
                <a href="/project/{{ proj.id }}" class="btn-launch">
                    Launch Module &rarr;
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
