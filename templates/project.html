<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.title }} - Direct Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #cam-video { display: none; }
        #cam-canvas { transform: scaleX(-1); }
        #virtual-cursor {
            position: fixed;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.9);
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px #38bdf8;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            display: none;
            transition: transform 0.05s ease-out;
        }
        #virtual-cursor.clicking {
            width: 32px;
            height: 32px;
            background: rgba(34, 197, 94, 0.9);
            border-color: #4ade80;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative select-none">

    <div id="virtual-cursor"></div>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
        <a href="/" class="interactive-elem inline-flex items-center gap-2 text-slate-400 hover:text-white text-sm font-medium mb-4 transition-colors p-2 rounded-lg hover:bg-slate-900 border border-transparent hover:border-slate-800">
            &larr; Back to Dashboard
        </a>

        <div class="flex items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <span class="text-3xl">{{ project.icon }}</span>
                <div>
                    <h1 class="text-2xl font-bold text-white">{{ project.title }}</h1>
                    <p class="text-xs text-slate-400">Direct Index Tracking Active</p>
                </div>
            </div>
            <div class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold uppercase tracking-wider">
                ● Camera Live
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden aspect-video flex items-center justify-center shadow-xl">
                    <video id="cam-video" playsinline autoplay></video>
                    <canvas id="cam-canvas" class="w-full h-full object-cover"></canvas>
                    <div id="cam-loading" class="absolute inset-0 bg-slate-950 flex items-center justify-center text-slate-400 text-sm">
                        Starting Camera...
                    </div>
                </div>

                <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl p-4">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hover Targets (0.5s Auto Click)</div>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="logAction('Target Alpha Triggered')" class="interactive-elem p-3 rounded-lg bg-slate-800 hover:bg-cyan-600/30 border border-slate-700 text-xs font-medium text-center transition-all">
                            Target A
                        </button>
                        <button onclick="logAction('Target Beta Triggered')" class="interactive-elem p-3 rounded-lg bg-slate-800 hover:bg-emerald-600/30 border border-slate-700 text-xs font-medium text-center transition-all">
                            Target B
                        </button>
                        <button onclick="logAction('Target Gamma Triggered')" class="interactive-elem p-3 rounded-lg bg-slate-800 hover:bg-purple-600/30 border border-slate-700 text-xs font-medium text-center transition-all">
                            Target C
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5">
                    <h3 class="text-sm font-semibold text-white mb-3">⚡ Live Telemetry</h3>
                    <div class="space-y-2.5 font-mono text-xs bg-slate-950/70 p-3.5 rounded-lg border border-slate-800 text-emerald-400">
                        <div>Point: <span class="text-cyan-400">Index Tip (Landmark 8)</span></div>
                        <div>Coords: <span id="tel-pos" class="text-white">--</span></div>
                        <div>Status: <span id="tel-status" class="text-yellow-400">Scanning</span></div>
                        <div>Log: <span id="tel-log" class="text-emerald-300">Ready</span></div>
                    </div>
                </div>

                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5">
                    <h3 class="text-sm font-semibold text-white mb-2">🔊 Direct Signal Meter</h3>
                    <div class="w-full bg-slate-950 h-6 rounded-full overflow-hidden border border-slate-800 p-0.5">
                        <div id="volume-meter" class="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full rounded-full transition-all duration-75" style="width: 50%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('cam-video');
        const canvas = document.getElementById('cam-canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('virtual-cursor');
        const loading = document.getElementById('cam-loading');
        const volMeter = document.getElementById('volume-meter');

        let lastX = window.innerWidth / 2;
        let lastY = window.innerHeight / 2;
        let hoverStart = null;
        let currentHovered = null;

        function logAction(msg) {
            document.getElementById('tel-log').innerText = msg;
        }

        function onResults(results) {
            loading.style.display = 'none';
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                cursor.style.display = 'block';
                document.getElementById('tel-status').innerText = 'Index Locked';

                const idx = results.multiHandLandmarks[0][8];

                const px = idx.x * canvas.width;
                const py = idx.y * canvas.height;
                ctx.beginPath();
                ctx.arc(px, py, 8, 0, 2 * Math.PI);
                ctx.fillStyle = '#06b6d4';
                ctx.fill();

                const targetX = (1.0 - idx.x) * window.innerWidth;
                const targetY = idx.y * window.innerHeight;
                lastX += (targetX - lastX) * 0.6;
                lastY += (targetY - lastY) * 0.6;

                cursor.style.left = lastX + 'px';
                cursor.style.top = lastY + 'px';
                document.getElementById('tel-pos').innerText = Math.round(lastX) + ', ' + Math.round(lastY);

                const val = Math.min(100, Math.max(0, Math.round((1.0 - idx.y) * 100)));
                volMeter.style.width = val + '%';

                const elem = document.elementFromPoint(lastX, lastY);
                const clickable = elem ? elem.closest('button, a, .interactive-elem') : null;

                if (clickable) {
                    if (currentHovered !== clickable) {
                        currentHovered = clickable;
                        hoverStart = Date.now();
                    } else if (Date.now() - hoverStart >= 500) {
                        cursor.classList.add('clicking');
                        clickable.click();
                        setTimeout(() => cursor.classList.remove('clicking'), 250);
                        hoverStart = Date.now() + 1000;
                    }
                } else {
                    currentHovered = null;
                    hoverStart = null;
                }
            } else {
                cursor.style.display = 'none';
                document.getElementById('tel-status').innerText = 'Scanning for Finger';
            }
            ctx.restore();
        }

        window.addEventListener('DOMContentLoaded', () => {
            canvas.width = 640;
            canvas.height = 480;

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onResults);

            const camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: 640,
                height: 480
            });

            camera.start();
        });
    </script>
</body>
</html>
